packages:
  - apps/*
  - packages/*

# Every dependency is pinned to an exact version (spec §1, §20.4).
saveExact: true

# One Effect version everywhere: the one Foldkit pins as its peer (spec §6).
overrides:
  effect: 4.0.0
  '@effect/platform-browser': 4.0.0
  '@effect/platform-node': 4.0.0
  '@effect/platform-node-shared': 4.0.0
  '@effect/sql-sqlite-node': 4.0.0
  '@effect/vitest': 4.0.0

allowBuilds:
  electron: true
  esbuild: true
  # electron-builder's Squirrel.Windows maker, whose postinstall fetches its binaries: the app builds NSIS.
  electron-winstaller: false
  msgpackr-extract: false
  # Pi's dependencies (spec §22.1): a no-op preinstall and a version check, neither needed.
  '@google/genai': false
  protobufjs: false
