# Releases a version (spec §22.5), run from the Actions tab (workflow_dispatch) on main with the version:
# beside its own check, on Linux x64 only, it builds the engine distribution for every engine target
# (pnpm --filter @fabrica/engine-app dist all), signs and notarises the macOS archives' binaries, runs each
# archive's fabrica --version on its own system, then writes checksums.txt over the archives, signs it with
# the ed25519 release key as checksums.txt.sig (orchestra's scheme, scripts/sign-checksums.ts), attests
# the archives' build provenance (actions/attest) and publishes the GitHub Release, tagging the commit
# v<version> as it does, with the commit's scripts/install.sh among its assets.
#
# It tags only once main's check has passed on every engine target in CI (ci.yml's `full check, <target>`
# jobs; H87): a job GitHub couldn't place, or that failed, is rerun there first, then this. A release
# commit pushed alone, which CI leaves (scripts/release-commit.sh), is held to its parent's checks.
# Run again for a version tagged already, it releases the tag's commit again: its notes and assets are
# replaced. A version with a suffix (0.1.0-rc.1) makes a pre-release, which is never GitHub's latest.
#
# Releasing: `node scripts/release-notes.ts --gather X.Y.Z` gathers changes/ into CHANGELOG.md's section
# for the version, which becomes the notes (cut to fit, scripts/release-notes.ts), and sets the version
# in package.json and apps/engine/package.json. Commit that alone on main as 'Release X.Y.Z', push it
# once the commits under it have passed CI, and run this workflow with X.Y.Z.
#
# The secrets: FABRICA_RELEASE_KEY, a PKCS#8 PEM ed25519 private key whose public half is in
# scripts/install.sh's release_keys (scripts/sign-checksums.ts says how to make one). Without it the run
# is a dry run: everything but the signature and the publishing, and nothing is published. For macOS,
# APPLE_CERTIFICATE (a Developer ID Application certificate and its key, as a base64 .p12),
# APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY ("Developer ID Application: <name> (<team>)"), and
# for notarisation APPLE_ID, APPLE_TEAM_ID and APPLE_APP_PASSWORD (an app-specific password). Without
# them the macOS binaries are left as built, which only a pre-release may be published with.
name: Release
run-name: Release ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to release, X.Y.Z, or a pre-release's X.Y.Z-rc.1
        required: true
        type: string

permissions:
  contents: read

# One run at a time for a version; a second waits rather than racing it over the same assets.
concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version }}

jobs:
  # What the run releases, and which secrets it has.
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.commit.outputs.commit }}
      signed: ${{ steps.secrets.outputs.signed }}
      notarised: ${{ steps.secrets.outputs.notarised }}
    steps:
      - name: Check the version
        run: |
          if ! printf '%s\n' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::$VERSION is not a version: X.Y.Z, or X.Y.Z-<suffix> for a pre-release"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # A version tagged already is released again at its tag; a new one at main's head, the commit the
      # run started on.
      - name: Find the commit
        id: commit
        env:
          REF: ${{ github.ref }}
        run: |
          if commit=$(git rev-parse -q --verify "refs/tags/v$VERSION^{commit}"); then
            echo "v$VERSION is tagged already, at $commit: releasing it again"
          elif [ "$REF" = refs/heads/main ]; then
            commit=$GITHUB_SHA
          else
            echo "::error::Run the release on main: it runs on $REF"
            exit 1
          fi
          git checkout --quiet "$commit"
          for manifest in package.json apps/engine/package.json; do
            version=$(jq -r .version "$manifest")
            if [ "$version" != "$VERSION" ]; then
              echo "::error::$manifest's version at $commit is $version, not $VERSION: commit the release first (node scripts/release-notes.ts --gather $VERSION)"
              exit 1
            fi
          done
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Which secrets are there
        id: secrets
        env:
          RELEASE_KEY: ${{ secrets.FABRICA_RELEASE_KEY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          signed=false
          if [ -n "$RELEASE_KEY" ]; then
            signed=true
          else
            echo "::warning::No FABRICA_RELEASE_KEY: a dry run, nothing will be signed or published"
          fi
          notarised=false
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_CERTIFICATE_PASSWORD" ] &&
            [ -n "$APPLE_SIGNING_IDENTITY" ] && [ -n "$APPLE_ID" ] && [ -n "$APPLE_TEAM_ID" ] &&
            [ -n "$APPLE_APP_PASSWORD" ]; then
            notarised=true
          else
            case "$VERSION" in
            *-*) echo "::warning::No Apple signing secrets: the macOS binaries stay as built, unsigned by Fabrica and not notarised" ;;
            *)
              echo "::error::A release needs its macOS binaries signed and notarised: set the Apple signing secrets, or release a pre-release"
              exit 1
              ;;
            esac
          fi
          echo "signed=$signed" >> "$GITHUB_OUTPUT"
          echo "notarised=$notarised" >> "$GITHUB_OUTPUT"

  # The release's own check, on one platform: the notes, main's check on every engine target in CI, the
  # release key, and the full check.
  check:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      checks: read
    env:
      COMMIT: ${{ needs.prepare.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 2
          persist-credentials: false

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.22

      - name: Check the notes
        run: mise exec -- node scripts/release-notes.ts "$VERSION" > /dev/null

      # Each engine target's `full check` in CI, at the commit, or at its parent where it is a release
      # commit CI left (scripts/release-commit.sh): the latest run of each must have passed.
      - name: Check CI on every engine target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          targets="macos-x64 macos-arm64 linux-x64 linux-arm64"
          runs() {
            gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$1/check-runs?per_page=100" \
              --jq '.check_runs[] | [.id, .name, .status, (.conclusion // "none"), .html_url] | @tsv'
          }
          checked=$COMMIT
          all=$(runs "$checked")
          if ! printf '%s\n' "$all" | awk -F '\t' 'index($2, "full check, ") == 1 { found = 1 } END { exit !found }'; then
            if scripts/release-commit.sh "$(git rev-parse HEAD^)"; then
              checked=$(git rev-parse HEAD^)
              echo "$COMMIT is a release commit CI left: its parent $checked's checks stand for it"
              all=$(runs "$checked")
            fi
          fi
          failed=0
          for target in $targets; do
            run=$(printf '%s\n' "$all" | awk -F '\t' -v name="full check, $target" '$2 == name' |
              sort -n | tail -n 1)
            if [ -z "$run" ]; then
              echo "::error::CI has no full check on $target at $checked: run CI there, then this release"
              failed=1
              continue
            fi
            status=$(printf '%s\n' "$run" | cut -f3)
            conclusion=$(printf '%s\n' "$run" | cut -f4)
            url=$(printf '%s\n' "$run" | cut -f5)
            if [ "$status" != completed ] || [ "$conclusion" != success ]; then
              echo "::error::CI's full check on $target at $checked is $status ($conclusion): rerun it ($url), then this release"
              failed=1
            else
              echo "full check, $target: passed at $checked"
            fi
          done
          exit "$failed"

      # The key signs a file here, so a bad key, or one scripts/install.sh doesn't hold, fails the release
      # before anything is built for it.
      - name: Check the release key
        if: needs.prepare.outputs.signed == 'true'
        env:
          FABRICA_RELEASE_KEY: ${{ secrets.FABRICA_RELEASE_KEY }}
        run: |
          echo probe > "$RUNNER_TEMP/probe"
          mise exec -- node scripts/sign-checksums.ts "$RUNNER_TEMP/probe"

      - name: Install dependencies
        run: mise exec -- pnpm install --frozen-lockfile

      - name: Check
        run: scripts/check-full.sh

  # Every target's archive, built on one host: the bundles are JavaScript, and Pi's native files come
  # prebuilt for every platform (apps/engine/build/distribution.ts).
  build:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.22

      - name: Install dependencies
        run: mise exec -- pnpm install --frozen-lockfile

      - name: Build
        run: mise exec -- pnpm --filter @fabrica/engine-app dist all

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archives
          path: apps/engine/out/fabrica-*.tar.gz
          if-no-files-found: error
          compression-level: 0 # gzipped already
          retention-days: 7

  # Every Mach-O in the macOS archives signed with the Developer ID under the hardened runtime, Node with
  # its entitlements (apps/engine/build/entitlements.plist), and notarised; the archives packed again.
  sign-macos:
    needs: [prepare, build]
    if: needs.prepare.outputs.notarised == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: archives
          path: archives

      - name: Import the certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -hex 24)
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain"
          rm -f "$RUNNER_TEMP/certificate.p12"

      - name: Sign and notarise
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          entitlements="$PWD/apps/engine/build/entitlements.plist"
          for target in darwin-x64 darwin-arm64; do
            name="fabrica-$VERSION-$target"
            work="$RUNNER_TEMP/$target"
            mkdir -p "$work"
            tar -xzf "archives/$name.tar.gz" -C "$work"
            find "$work/$name" -type f -print | while IFS= read -r file; do
              case "$(file -b "$file")" in
              Mach-O*)
                if [ "$file" = "$work/$name/node/bin/node" ]; then
                  codesign --force --timestamp --options runtime --entitlements "$entitlements" \
                    --sign "$APPLE_SIGNING_IDENTITY" "$file"
                else
                  codesign --force --timestamp --options runtime --sign "$APPLE_SIGNING_IDENTITY" "$file"
                fi
                ;;
              esac
            done
            codesign --verify --strict --verbose=2 "$work/$name/node/bin/node"
            ditto -c -k --keepParent "$work/$name" "$work/$name.zip"
            xcrun notarytool submit "$work/$name.zip" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_PASSWORD" --wait --output-format json > "$work/notarised.json"
            status=$(jq -r .status "$work/notarised.json")
            if [ "$status" != Accepted ]; then
              echo "::error::Notarising $name: $status ($(jq -r '.message // ""' "$work/notarised.json"))"
              exit 1
            fi
            # macOS's tar would add AppleDouble files for extended attributes; COPYFILE_DISABLE stops it.
            COPYFILE_DISABLE=1 tar -czf "archives/$name.tar.gz" -C "$work" "$name"
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archives-signed
          path: archives/fabrica-*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Remove the keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

  # Each archive on a runner of its own system and architecture: unpacked, its fabrica --version is the
  # release's.
  run:
    needs: [prepare, build, sign-macos]
    if: >-
      always() && needs.prepare.result == 'success' && needs.build.result == 'success' &&
      (needs.sign-macos.result == 'success' || needs.sign-macos.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-x64
            runner: macos-26-intel
          - target: darwin-arm64
            runner: macos-26
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
    name: run, ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    env:
      TARGET: ${{ matrix.target }}
      NOTARISED: ${{ needs.prepare.outputs.notarised }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.prepare.outputs.notarised == 'true' && 'archives-signed' || 'archives' }}

      - name: Run
        run: |
          name="fabrica-$VERSION-$TARGET"
          tar -xzf "$name.tar.gz"
          if [ "$NOTARISED" = true ]; then
            codesign --verify --strict --verbose=2 "$name/node/bin/node"
          fi
          said=$("$name/bin/fabrica" --version)
          echo "$said"
          if [ "$said" != "fabrica v$VERSION" ]; then
            echo "::error::fabrica --version printed '$said', not 'fabrica v$VERSION'"
            exit 1
          fi

  publish:
    needs: [prepare, check, build, sign-macos, run]
    if: >-
      always() && needs.prepare.outputs.signed == 'true' && needs.check.result == 'success' &&
      needs.build.result == 'success' && needs.run.result == 'success' &&
      (needs.sign-macos.result == 'success' || needs.sign-macos.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # the Release, its assets and its tag
      id-token: write # the attestations' signing certificate
      attestations: write
      artifact-metadata: write
    env:
      COMMIT: ${{ needs.prepare.outputs.commit }}
    steps:
      # Every tag, for picking the newest release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.22

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.prepare.outputs.notarised == 'true' && 'archives-signed' || 'archives' }}
          path: dist

      - name: Checksums
        working-directory: dist
        run: |
          count=$(find . -maxdepth 1 -name "fabrica-$VERSION-*.tar.gz" | wc -l)
          if [ "$count" -ne 4 ]; then
            echo "::error::$count archives, not one for each of the 4 engine targets"
            ls
            exit 1
          fi
          sha256sum "fabrica-$VERSION"-*.tar.gz > checksums.txt
          cat checksums.txt

      - name: Sign
        env:
          FABRICA_RELEASE_KEY: ${{ secrets.FABRICA_RELEASE_KEY }}
        run: mise exec -- node scripts/sign-checksums.ts dist/checksums.txt

      - name: Build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/fabrica-*.tar.gz

      # Only the newest release is GitHub's latest, which the install script and fabrica engine update
      # download: releasing an older version again leaves it where it is. A pre-release never is. The
      # commit's scripts/install.sh goes with the archives, so releases/latest/download/install.sh is the
      # script made with the latest release, not main's.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$VERSION"
          mise exec -- node scripts/release-notes.ts "$VERSION" > "$RUNNER_TEMP/notes.md"
          case "$VERSION" in *-*) prerelease=true ;; *) prerelease=false ;; esac
          newest=$({ git tag -l 'v*'; echo "$tag"; } | { grep -v -e - || true; } | sort -V | tail -n 1)
          if [ "$tag" = "$newest" ] && [ "$prerelease" = false ]; then latest=true; else latest=false; fi
          echo "$tag at $COMMIT: pre-release $prerelease, latest $latest (newest release: ${newest:-none})"
          set -- dist/fabrica-*.tar.gz dist/checksums.txt dist/checksums.txt.sig scripts/install.sh
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release edit "$tag" --notes-file "$RUNNER_TEMP/notes.md" \
              --prerelease="$prerelease" --latest="$latest"
            gh release upload "$tag" --clobber "$@"
          else
            gh release create "$tag" --target "$COMMIT" --title "Fabrica $VERSION" \
              --notes-file "$RUNNER_TEMP/notes.md" --prerelease="$prerelease" --latest="$latest" "$@"
          fi
