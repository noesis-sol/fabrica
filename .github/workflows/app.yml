# The app (spec §22.2, §22.3, §4): on every push and pull request, the app packaged for each of its five
# targets on that target's own runner (dmg and zip per macOS architecture, AppImage, deb and rpm per Linux
# architecture, NSIS for Windows x64), with the engine distribution it embeds built first, and every
# artifact smoke-tested: installed or unpacked as a user would, then launched and driven by
# apps/desktop/test/smoke.test.ts through Playwright's Electron support. The packages are kept for a week.
#
# Signing runs only where its secrets are (§20.5), as release.yml's: for macOS APPLE_CERTIFICATE (a
# Developer ID Application certificate and its key, as a base64 .p12) and APPLE_CERTIFICATE_PASSWORD, and
# for notarisation APPLE_ID, APPLE_TEAM_ID and APPLE_APP_PASSWORD; for Windows WINDOWS_CERTIFICATE (an
# Authenticode certificate, a base64 .pfx) and WINDOWS_CERTIFICATE_PASSWORD. Without them the packages are
# built unsigned, and a pull request from a fork never has them.
#
# Every download is checked against a checksum (§20.4): the actions by their commit, mise against its
# signed release checksums, Node and pnpm against mise.lock, the npm packages against pnpm-lock.yaml,
# Electron against the checksums its package ships (electron-builder packs that Electron), the Node the
# engine distribution bundles against mise.lock, and electron-builder's tools (fpm, the AppImage runtime,
# NSIS) against the checksums electron-builder pins for them.
#
# A release commit pushed alone is left to the release workflow, as CI's checks are (ci.yml, §22.5).
#
# The release workflow (release.yml, §22.5) calls this one for the release's commit (`ref`) and with the
# release's own engine (`engine`, an artifact of its run holding the engine archives, the signed ones for
# macOS where they were, and their checksums.txt, with checksums.txt.sig where the release is signed),
# which every target embeds in place of one built here; it publishes the app-<target> artifacts.
name: App

on:
  push:
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: The commit to package
        required: true
        type: string
      engine:
        description: The artifact of the run holding the engine's release folder, which the app embeds
        required: true
        type: string

permissions:
  contents: read

# A release's call is its run's own.
concurrency:
  group: app-${{ inputs.engine && github.run_id || github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release-commit:
    name: release commit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      alone: ${{ steps.gate.outputs.alone }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Is it a release commit pushed alone?
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = push ] && scripts/release-commit.sh "$BEFORE"; then
            echo "alone=true" >> "$GITHUB_OUTPUT"
          else
            echo "alone=false" >> "$GITHUB_OUTPUT"
          fi

  # The Linux x64 engine distribution the Windows app embeds, built where its links can be made; a
  # release's call has the release's.
  engine-for-windows:
    name: engine for Windows
    needs: release-commit
    if: needs.release-commit.outputs.alone != 'true' && !inputs.engine
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.22

      - name: Install dependencies
        run: mise exec -- pnpm install --frozen-lockfile

      - name: Build the engine distribution
        run: mise exec -- pnpm --filter @fabrica/engine-app dist linux-x64

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-linux-x64
          path: |
            apps/engine/out/fabrica-*-linux-x64.tar.gz
            apps/engine/out/checksums.txt
          if-no-files-found: error
          compression-level: 0 # gzipped already
          retention-days: 1

  package:
    name: app, ${{ matrix.target }}
    needs: [release-commit, engine-for-windows]
    if: >-
      ${{ !cancelled() && needs.release-commit.result == 'success' &&
      needs.release-commit.outputs.alone != 'true' && (needs.engine-for-windows.result == 'success' ||
      (inputs.engine && needs.engine-for-windows.result == 'skipped')) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            runner: macos-26
            os: macos
            arch: arm64
            engine: darwin-arm64
          - target: macos-x64
            runner: macos-26-intel
            os: macos
            arch: x64
            engine: darwin-x64
          - target: linux-x64
            runner: ubuntu-24.04
            os: linux
            arch: x64
            engine: linux-x64
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
            engine: linux-arm64
          - target: windows-x64
            runner: windows-2025
            os: windows
            arch: x64
            engine: linux-x64
    defaults:
      run:
        shell: bash
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.22

      - name: Find the pnpm store
        id: pnpm-store
        run: echo "path=$(mise exec -- pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ matrix.target }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ matrix.target }}-

      - name: Install dependencies
        run: mise exec -- pnpm install --frozen-lockfile

      # rpm's rpmbuild for the rpm, rpm2cpio to unpack it; FUSE 2 to mount the AppImage. Ubuntu 24.04's
      # AppArmor keeps unprivileged user namespaces from Chromium's sandbox where its setuid helper isn't
      # installed (the AppImage, the unpacked rpm): the runner allows them, as a desktop that runs
      # AppImages does.
      - name: Install the Linux packaging tools
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends rpm libfuse2t64
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Build the engine distribution
        if: matrix.os != 'windows' && !inputs.engine
        env:
          ENGINE: ${{ matrix.engine }}
        run: mise exec -- pnpm --filter @fabrica/engine-app dist "$ENGINE"

      - name: Fetch the engine distribution
        if: matrix.os == 'windows' && !inputs.engine
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: engine-linux-x64
          path: apps/engine/out

      - name: Fetch the release's engine
        if: inputs.engine
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.engine }}
          path: apps/engine/out

      # Without a target's signing secrets, electron-builder is kept from signing with whatever identity
      # the runner's keychain holds.
      - name: Which secrets are there
        env:
          OS: ${{ matrix.os }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
        run: |
          case "$OS" in
          macos) certificate=$APPLE_CERTIFICATE ;;
          windows) certificate=$WINDOWS_CERTIFICATE ;;
          *) certificate= ;;
          esac
          if [ -z "$certificate" ]; then
            if [ "$OS" != linux ]; then
              echo "::warning::No signing certificate for $OS: the app is built unsigned"
            fi
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
          fi

      - name: Package
        env:
          CSC_LINK: ${{ matrix.os == 'macos' && secrets.APPLE_CERTIFICATE || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.os == 'macos' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_ID: ${{ matrix.os == 'macos' && secrets.APPLE_ID || '' }}
          APPLE_TEAM_ID: ${{ matrix.os == 'macos' && secrets.APPLE_TEAM_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.os == 'macos' && secrets.APPLE_APP_PASSWORD || '' }}
          WIN_CSC_LINK: ${{ matrix.os == 'windows' && secrets.WINDOWS_CERTIFICATE || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ matrix.os == 'windows' && secrets.WINDOWS_CERTIFICATE_PASSWORD || '' }}
        run: mise exec -- pnpm --filter @fabrica/desktop run package "--$ARCH"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-${{ matrix.target }}
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.deb
            apps/desktop/dist/*.rpm
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/latest*.yml
          if-no-files-found: error
          retention-days: 7

      # Each artifact as a user gets the app from it: the zip unpacked, the dmg's app copied out.
      - name: Smoke-test the zip and the dmg
        if: matrix.os == 'macos'
        run: |
          set -eu
          smoke() {
            echo "::group::$1"
            FABRICA_SMOKE_APP="$2" mise exec -- pnpm --filter @fabrica/desktop smoke
            echo "::endgroup::"
          }
          set -- apps/desktop/dist/Fabrica-*-mac-"$ARCH".zip
          ditto -x -k "$1" "$RUNNER_TEMP/zip"
          smoke zip "$RUNNER_TEMP/zip/Fabrica.app/Contents/MacOS/Fabrica"
          set -- apps/desktop/dist/Fabrica-*-mac-"$ARCH".dmg
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg" "$1"
          ditto "$RUNNER_TEMP/dmg/Fabrica.app" "$RUNNER_TEMP/dmg-app/Fabrica.app"
          hdiutil detach "$RUNNER_TEMP/dmg"
          smoke dmg "$RUNNER_TEMP/dmg-app/Fabrica.app/Contents/MacOS/Fabrica"

      # The AppImage run as it is; the deb installed; the rpm's payload unpacked, its scriptlets aside,
      # since the runner is no rpm system.
      - name: Smoke-test the AppImage, the deb and the rpm
        if: matrix.os == 'linux'
        run: |
          set -eu
          smoke() {
            echo "::group::$1"
            FABRICA_SMOKE_APP="$2" xvfb-run -a mise exec -- pnpm --filter @fabrica/desktop smoke
            echo "::endgroup::"
          }
          set -- apps/desktop/dist/Fabrica-*.AppImage
          chmod +x "$1"
          smoke AppImage "$PWD/$1"
          set -- apps/desktop/dist/*.deb
          sudo apt-get install -y --no-install-recommends "$PWD/$1"
          smoke deb /opt/Fabrica/fabrica-app
          sudo apt-get remove -y "$(dpkg-deb --field "$1" Package)"
          set -- apps/desktop/dist/*.rpm
          mkdir -p "$RUNNER_TEMP/rpm"
          rpm2cpio "$1" | (cd "$RUNNER_TEMP/rpm" && cpio -idm --quiet)
          smoke rpm "$RUNNER_TEMP/rpm/opt/Fabrica/fabrica-app"

      # The NSIS installer run silently into a folder of the runner's, as a user's install.
      - name: Smoke-test the NSIS installer
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem apps/desktop/dist/Fabrica-*-win-x64.exe | Select-Object -First 1
          $folder = Join-Path $env:RUNNER_TEMP 'Fabrica'
          $install = Start-Process -FilePath $installer.FullName -ArgumentList '/S', "/D=$folder" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "the installer exited with $($install.ExitCode)" }
          $env:FABRICA_SMOKE_APP = Join-Path $folder 'Fabrica.exe'
          mise exec -- pnpm --filter @fabrica/desktop smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
